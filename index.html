<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <link rel="icon" href="./icon/physics.png" type="image/png" />
    <!-- Tipografia: Inter (ver --font-sans no CSS). Se a fonte não carregar, o navegador usa a fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Bibliotecas: cópias locais versionadas em assets/vendor (o Netlify NÃO publica a pasta
         node_modules, por isso o HTML não deve apontar para ela). Versões e como atualizar:
         assets/vendor/README.md. Caminhos em minúsculas e relativos, iguais no Windows e no Linux. -->
    <link
      rel="stylesheet"
      href="./assets/vendor/bootstrap/css/bootstrap.min.css"
    />
    <!-- O bundle do Bootstrap já inclui o Popper (dropdown e tooltips); por isso não há script do Popper à parte.
         Ele define o objeto global "bootstrap" usado pelo script ao final desta página. -->
    <script src="./assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- Highcharts: o núcleo vem primeiro; os módulos (acessibilidade e exportação) dependem dele. -->
    <script src="./assets/vendor/highcharts/highcharts.src.js"></script>
    <script src="./assets/vendor/highcharts/modules/accessibility.js"></script>
    <script src="./assets/vendor/highcharts/modules/exporting.src.js"></script>
    <title>Motor Stirling LTD (Tipo Gama)</title>
    <style>
      /* =====================================================================
         ÍNDICE DO CSS
         1. Variáveis (cores, tipografia, medidas)      6. Controles (play, reload, temperaturas, trabalho)
         2. Base / reset                                7. Barra inferior e menu de materiais
         3. Estrutura da página (grid)                  8. Breakpoints: ≤1200, ≤1000, retrato/≤700, ≤400
         4. Cabeçalho                                   9. Ajustes para toque e fallback sem container queries
         5. Painéis (motor e gráfico)
         ===================================================================== */

      /* ------------------ 1. Variáveis ----------------- */
      :root {
        /* Cores: o par frio (azul) / quente (laranja) é o motivo visual do projeto */
        --cold: rgb(30, 144, 255);
        --hot: rgb(255, 111, 0);
        --ink: #1d2433;
        --ink-soft: #4a5468;
        --line: #dde2ea;
        --surface: #ffffff;
        --dark: rgb(69, 68, 67);
        --nav-bg: #0e1116;
        --focus: rgba(30, 144, 255, 0.6);

        /* Tipografia */
        --font-sans:
          "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;

        /* Forma */
        --radius: 12px;
        --radius-sm: 6px;
        --shadow-sm:
          0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
        --btn-shadow:
          inset 2px 2px 5px 2px rgba(226, 222, 218, 0.5),
          inset -2px -2px 5px 2px rgba(0, 0, 0, 0.5);
        --btn-shadow-pressed:
          inset 0 0 5px 8px rgba(226, 222, 218, 0.4),
          inset 0 0 5px 8px rgba(226, 222, 218, 0.4);

        /* Medidas que mudam nos breakpoints */
        --pad: clamp(8px, 1.4vw, 20px);
        --footer-h: clamp(48px, 8vh, 72px);
        --btn-sm: 34px; /* rewind, step, reload */
        --btn-lg: 54px; /* play / pause */
        --arrow-size: 14px; /* botões ▲/▼ das temperaturas */
        --temp-w: 120px; /* largura do valor de temperatura */
        --eng-cap: clamp(560px, 35vw, 700px); /* largura máxima do Canvas do motor */
        --chart-cap: clamp(560px, 42vw, 720px); /* largura máxima do gráfico P-V */
        --chart-ratio: 3 / 2; /* proporção largura/altura do gráfico */
      }

      /* ------------------ 2. Base ----------------- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* O Bootstrap define margens em p/h1/ul com seletor de elemento; este reset vem depois e prevalece */
      p,
      h1,
      ul {
        margin: 0;
        padding: 0;
      }

      html {
        font-family: var(--font-sans);
        color: var(--ink);
        -webkit-text-size-adjust: 100%;
      }

      body {
        background: var(--surface);
        overflow-x: hidden;
      }

      button,
      input {
        font-family: inherit;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* ------------------ 3. Estrutura da página ----------------- */
      /* Telas largas: painel de altura fixa (cabeçalho / palco / barra inferior).
         Telas estreitas: a página rola na vertical (ver breakpoints). */
      .container-box {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 560px;
        display: grid;
        /* minmax(0, 1fr): a coluna não cresce com o conteúdo (ex.: o Highcharts guarda a largura anterior
           até o reflow) — sem isso o layout não encolheria depois de reduzir a janela */
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow-x: clip;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
      }

      .panels {
        display: grid;
        /* levemente mais largo para o motor: mantém o desenho na escala de referência (0,75) em notebooks */
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: var(--pad);
        padding: var(--pad) var(--pad) 0;
        min-height: 0;
      }

      /* ------------------ 4. Cabeçalho (título) ----------------- */
      .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px var(--pad) 11px;
        background:
          linear-gradient(
            90deg,
            rgba(30, 144, 255, 0.16) 0%,
            rgba(30, 144, 255, 0) 38%,
            rgba(255, 111, 0, 0) 62%,
            rgba(255, 111, 0, 0.18) 100%
          ),
          var(--surface);
      }

      /* Filete frio → quente sob o título */
      .header::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--cold) 0%,
          rgba(30, 144, 255, 0.35) 40%,
          rgba(255, 111, 0, 0.35) 60%,
          var(--hot) 100%
        );
      }

      .title-menu {
        min-width: 0;
        display: flex;
        justify-content: center;
      }

      .app-title {
        font-size: clamp(1.1rem, 0.8rem + 1.3vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.2;
        color: var(--ink);
        text-align: center;
        text-wrap: balance;
      }

      .title-sub {
        display: inline-block;
        font-weight: 500;
        color: var(--ink-soft);
      }

      /* ------------------ 5. Painéis ----------------- */
      .engine-panel,
      .chart-panel {
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        container-type: size; /* habilita as unidades cqw/cqh dos filhos */
      }

      /* Motor: [coluna das temperaturas] + [Canvas]. O Canvas mantém a proporção do desenho
         (560 × 440) e cabe no painel sem distorção; --eng-w/--eng-h são usados pelo Canvas e
         pela coluna de temperaturas para ficarem alinhados. */
      .engine-stage {
        --temps-w: calc(var(--temp-w) + var(--arrow-size) + 12px);
        --eng-w: min(100cqw - var(--temps-w), 100cqh * 560 / 440, var(--eng-cap));
        --eng-h: calc(var(--eng-w) * 440 / 560);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .engine-stage canvas {
        flex: 0 0 auto;
        display: block;
        width: var(--eng-w);
        height: var(--eng-h);
      }

      .temperature-controls {
        position: relative;
        flex: 0 0 var(--temps-w);
        width: var(--temps-w);
        height: var(--eng-h);
      }

      /* Gráfico P-V: o Highcharts preenche este contêiner (proporção fixa) e se redimensiona com ele */
      #circleStirling {
        width: min(100cqw, 100cqh * 3 / 2, var(--chart-cap));
        aspect-ratio: var(--chart-ratio);
        max-width: 100%;
      }

      /* ------------------ 6. Controles ----------------- */
      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        column-gap: var(--pad);
        padding: 10px var(--pad) 12px;
      }

      /* Os dois blocos do .button-box entram direto na grade de .controls */
      .button-box {
        display: contents;
      }

      .button-box-principal {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
      }

      .button-box-reload {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Botões redondos (rewind, play, step, reload) */
      .button-rewind,
      .button-play,
      .button-step,
      .button-reload {
        flex: 0 0 auto;
        border-radius: 50%;
        border: 1px solid rgba(69, 68, 67, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--dark);
        color: #f5f5f4;
        box-shadow: var(--btn-shadow);
        transition: filter 0.15s ease;
      }

      .button-rewind,
      .button-step,
      .button-reload {
        width: var(--btn-sm);
        height: var(--btn-sm);
      }

      .button-play {
        width: var(--btn-lg);
        height: var(--btn-lg);
      }

      .button-reload {
        background-color: var(--hot);
        color: #fff;
        border-color: rgba(69, 68, 67, 0.5);
      }

      .button-rewind:hover,
      .button-play:hover,
      .button-step:hover,
      .button-reload:hover {
        filter: brightness(1.18);
      }

      .button-rewind:active,
      .button-play:active,
      .button-step:active,
      .button-reload:active {
        box-shadow: var(--btn-shadow-pressed);
      }

      .button-rewind:disabled,
      .button-step:disabled {
        cursor: not-allowed;
        filter: none;
      }

      .rewind,
      .step,
      .reload {
        width: 70%;
        height: 70%;
      }

      .play,
      .pause {
        width: 82%;
        height: 82%;
      }

      /* Entradas de temperatura (fonte fria / fonte quente) */
      .cold-temperature,
      .hot-temperature {
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }

      /* Telas largas: ficam à esquerda do motor, na altura da placa fria e da placa quente.
         As porcentagens são posições no desenho do Canvas (placa fria ≈ 64 %, placa quente ≈ 89 %
         da altura); 18px é a altura do rótulo e --arrow-size a metade do valor. */
      .temperature-controls .cold-temperature,
      .temperature-controls .hot-temperature {
        position: absolute;
        right: 0;
      }

      .temperature-controls .cold-temperature {
        top: calc(63.7% - 18px - var(--arrow-size));
      }

      .temperature-controls .hot-temperature {
        top: calc(89.3% - 18px - var(--arrow-size));
      }

      .text-input-cold-temperature,
      .text-input-hot-temperature {
        width: var(--temp-w);
      }

      .text-input-cold-temperature p:first-child,
      .text-input-hot-temperature p:first-child {
        font-size: 14px;
        font-weight: 700;
        line-height: 18px;
        color: var(--ink);
        white-space: nowrap;
      }

      .cold-source,
      .hot-source {
        height: calc(2 * var(--arrow-size));
        display: flex;
        align-items: center;
        padding: 0 8px;
        border: 1px solid rgba(0, 0, 0, 0.7);
        border-radius: var(--radius-sm);
        color: #000;
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .cold-source {
        background-color: var(--cold);
      }

      .hot-source {
        background-color: var(--hot);
      }

      .cold-temperature button,
      .hot-temperature button {
        width: var(--arrow-size);
        height: var(--arrow-size);
        background-color: transparent;
        border: transparent;
        border-radius: 3px;
        color: var(--ink);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .cold-temperature-buttons,
      .hot-temperature-buttons {
        display: flex;
        flex-direction: column;
      }

      .cold-temperature button:hover:not(:disabled),
      .hot-temperature button:hover:not(:disabled) {
        color: #0b5ed7;
      }

      .cold-temperature button:disabled,
      .hot-temperature button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .cold-up,
      .cold-down,
      .hot-up,
      .hot-down {
        width: 100%;
        height: auto;
      }

      /* Leituras de trabalho: três colunas (rótulo | valor | unidade) alinhadas entre as duas linhas */
      .work-boxes {
        grid-column: 3;
        grid-row: 1;
        justify-self: start;
        display: grid;
        grid-template-columns: auto auto auto;
        align-items: center;
        column-gap: 6px;
        row-gap: 6px;
      }

      .work-box {
        display: contents;
      }

      .work-box p {
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
      }

      .work-box p:first-child {
        text-align: right;
      }

      .work {
        min-width: 5.4em;
        padding: 4px 8px;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.7);
        border-radius: var(--radius-sm);
        background-color: rgb(226, 224, 232);
        font-variant-numeric: tabular-nums;
      }

      /* ------------------ 7. Barra inferior ----------------- */
      .navbar-bottom-box {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 16px;
        min-height: var(--footer-h);
        padding: 5px 15px;
        background-color: var(--nav-bg);
      }

      /* Filete frio → quente no topo da barra */
      .navbar-bottom-box::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--cold), var(--hot));
        opacity: 0.85;
      }

      .navbar-bottom-box p,
      .navbar-bottom-box a,
      .materials-toggle {
        color: #fff;
        text-decoration: none;
        font-size: clamp(14px, 1.4vw, 20px);
      }

      .navbar-bottom-options > ul {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 15px;
        list-style: none;
      }

      .navbar-bottom-options > ul > li {
        position: relative;
      }

      .navbar-bottom-options > ul > li > a {
        display: inline-block;
        padding: 6px 2px;
        border-bottom: 2px solid transparent;
      }

      .navbar-bottom-options > ul > li > a:hover {
        border-bottom-color: var(--hot);
      }

      /* Menu "Materiais" (abre para cima; usa o dropdown do Bootstrap já carregado) */
      .materials-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        font-family: inherit;
        line-height: 1.3;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
      }

      .materials-toggle:hover,
      .materials-toggle.show {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.55);
      }

      .materials-toggle .mi-icon {
        width: 1.1em;
        height: 1.1em;
        flex: 0 0 auto;
      }

      .dropdown-menu.materials-menu {
        --bs-dropdown-min-width: 15rem;
        --bs-dropdown-padding-y: 6px;
        --bs-dropdown-border-color: var(--line);
        --bs-dropdown-border-radius: 10px;
        --bs-dropdown-box-shadow: 0 8px 24px rgba(16, 24, 40, 0.18);
        --bs-dropdown-link-active-bg: rgba(30, 144, 255, 0.12);
        font-family: var(--font-sans);
        max-width: min(20rem, calc(100vw - 24px));
      }

      .materials-menu .dropdown-header {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .dropdown-menu .materials-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--ink);
        text-decoration: none;
      }

      .materials-item:hover,
      .materials-item:focus-visible {
        background: rgba(30, 144, 255, 0.1);
        color: var(--ink);
      }

      .materials-item .mi-icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        color: var(--cold);
      }

      .materials-item .mi-ext {
        width: 16px;
        height: 16px;
        margin-left: auto;
        flex: 0 0 auto;
        color: var(--ink-soft);
      }

      /* ------------------ 8. Breakpoints ----------------- */

      /* ≤ 1200px: notebooks pequenos e janelas reduzidas — só espaçamentos e tamanhos */
      @media (max-width: 1200px) {
        :root {
          --pad: 12px;
          --temp-w: 108px;
          --eng-cap: 560px;
          --chart-cap: 600px;
        }

        .panels {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .text-input-cold-temperature p:first-child,
        .text-input-hot-temperature p:first-child {
          font-size: 13px;
        }

        .engine-panel,
        .chart-panel {
          padding: 8px;
        }
      }

      /* ≤ 1000px: a página passa a rolar; as temperaturas saem do lado do motor e
         os controles ocupam mais de uma linha */
      @media (max-width: 1000px) {
        :root {
          --footer-h: 52px;
          --temp-w: 120px;
          --chart-ratio: 4 / 3;
        }

        .container-box {
          height: auto;
          min-height: 100vh;
          min-height: 100dvh;
        }

        .stage {
          display: flex;
          flex-direction: column;
        }

        .engine-panel,
        .chart-panel {
          container-type: normal;
          padding: 10px;
        }

        .engine-panel {
          display: block;
        }

        .engine-stage {
          --eng-w: min(100%, var(--eng-cap));
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        .engine-stage canvas {
          width: var(--eng-w);
          height: auto;
          aspect-ratio: 560 / 440;
        }

        .temperature-controls {
          order: 2;
          position: static;
          flex: none;
          width: 100%;
          height: auto;
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 12px 28px;
        }

        .temperature-controls .cold-temperature,
        .temperature-controls .hot-temperature {
          position: static;
        }

        #circleStirling {
          width: min(100%, var(--chart-cap));
        }

        .controls {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          gap: 14px 28px;
          padding: 14px var(--pad) 16px;
        }

        .button-box {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 20px;
          width: 100%;
        }

        .button-box-principal,
        .button-box-reload {
          grid-column: auto;
        }

        .work-boxes {
          justify-self: auto;
        }
      }

      /* 701–1000px em paisagem: motor e gráfico lado a lado; gráfico mais alto para caber a legenda
         e play + leituras de trabalho na mesma linha, quando couberem */
      @media (min-width: 701px) and (max-width: 1000px) and (orientation: landscape) {
        :root {
          --chart-ratio: 1 / 1;
        }

        .button-box {
          width: auto;
        }
      }

      /* Retrato (tablets em pé) e telas ≤ 700px: uma coluna, na ordem
         motor → temperaturas → play → gráfico → trabalho */
      @media (max-width: 1000px) and (orientation: portrait), (max-width: 700px) {
        .stage {
          gap: 14px;
          padding: 12px var(--pad);
        }

        .panels,
        .controls {
          display: contents;
        }

        .engine-panel {
          order: 1;
        }

        .button-box {
          order: 2;
        }

        .chart-panel {
          order: 3;
        }

        .work-boxes {
          order: 4;
          align-self: center;
        }
      }

      /* ≤ 700px: celulares — alvos de toque maiores, barra inferior em duas linhas */
      @media (max-width: 700px) {
        :root {
          --btn-sm: 44px;
          --btn-lg: 64px;
          --arrow-size: 24px;
          --temp-w: 132px;
          --chart-ratio: 4 / 3;
          --footer-h: 0px;
        }

        .stage {
          padding-inline: 10px;
        }

        .button-box {
          gap: 18px;
        }

        .button-box-principal {
          gap: 14px;
        }

        .text-input-cold-temperature p:first-child,
        .text-input-hot-temperature p:first-child {
          font-size: 13px;
        }

        .cold-source,
        .hot-source {
          font-size: 16px;
        }

        .work-boxes {
          font-size: 15px;
        }

        .navbar-bottom-box {
          justify-content: center;
          text-align: center;
          padding: 8px 12px;
        }

        .navbar-bottom-box p {
          flex: 1 1 100%;
          font-size: 13px;
          opacity: 0.85;
        }

        .navbar-bottom-box a,
        .materials-toggle {
          font-size: 15px;
        }

        .navbar-bottom-options > ul {
          justify-content: center;
        }

        .navbar-bottom-options > ul > li > a {
          padding: 10px 4px;
        }
      }

      /* ≤ 480px: gráfico mais alto para não espremer a área de plotagem */
      @media (max-width: 480px) {
        :root {
          --chart-ratio: 9 / 10;
        }
      }

      /* ≤ 400px: celulares compactos (320 / 360 / 375) */
      @media (max-width: 400px) {
        :root {
          --pad: 8px;
          --temp-w: 120px;
        }

        .app-title {
          font-size: 1.1rem;
        }

        .stage {
          padding-inline: 8px;
        }

        .engine-panel,
        .chart-panel {
          padding: 6px;
        }

        .temperature-controls {
          gap: 10px 16px;
        }
      }

      /* ≤ 360px: as duas entradas de temperatura continuam lado a lado e o gráfico fica mais alto */
      @media (max-width: 360px) {
        :root {
          --temp-w: 108px;
          --chart-ratio: 5 / 6;
        }

        .cold-source,
        .hot-source {
          font-size: 15px;
        }
      }

      /* ------------------ 9. Toque e fallback ----------------- */
      /* Telas sensíveis ao toque: botões redondos e ▲/▼ maiores em qualquer largura */
      @media (pointer: coarse) {
        :root {
          --arrow-size: 24px;
          --btn-sm: 44px;
          --btn-lg: 64px;
        }
      }

      /* Navegadores sem container queries (unidades cqw/cqh): o painel usa dimensões simples */
      @supports not (width: 1cqw) {
        .engine-panel,
        .chart-panel {
          container-type: normal;
        }

        .engine-stage {
          --eng-w: min(100%, var(--eng-cap));
        }

        #circleStirling {
          width: min(100%, var(--chart-cap));
        }
      }
    </style>

    <script>
      /*=================================
       * SIMULADOR DO MOTOR STIRLING LTD (TIPO GAMA) — SCRIPT PRINCIPAL
       *=================================
       * FINALIDADE
       *   Calcular, animar e exibir o ciclo de um motor Stirling tipo gama de baixo diferencial de
       *   temperatura (LTD): desenho animado do mecanismo (Canvas 2D), diagrama P-V (Highcharts) e
       *   trabalho por ciclo (ideal e modelo de Schmidt) em função das temperaturas das fontes.
       *
       * ORGANIZAÇÃO (na ordem em que aparece no código)
       *   BLOCO 1  Interface inicial ........ tooltips Bootstrap dos botões.
       *   BLOCO 1B Estado inicial ........... INITIAL_STATE: fonte única dos valores padrão (inicialização e reload).
       *   BLOCO 2  Canvas ................... contexto 2D, resolução interna e posição do motor.
       *   BLOCO 3  Velocidade da animação ... omega (rad/quadro) em função de ΔT = Th − Tc.
       *   BLOCO 4  Modelo termodinâmico ..... constantes, geometria, volumes, pressões, ciclo ideal,
       *                                       curva de Schmidt, trabalhos e resumo no console.
       *   BLOCO 5  Temperaturas (UI) ........ botões ▲/▼ das fontes fria e quente.
       *   BLOCO 6  Gráfico P-V (Highcharts) . configuração, marcador "Estado Atual", cor do fluido.
       *   BLOCO 7  Ângulo mestre ............ setCycleAngle() e fases do ciclo.
       *   BLOCO 8  updateChart() ............ recálculo + atualização do gráfico a cada mudança de Th/Tc.
       *   BLOCO 9  Animação do Canvas ....... draw(): desenho do motor quadro a quadro.
       *   BLOCO 10 Controles ................ rewind, play/pause, step e reload.
       *   BLOCO 11 Inicialização ............ primeiro desenho e reflow do gráfico.
       *
       * UNIDADES
       *   volumes em cm³ · pressões calculadas em Pa e plotadas em kPa · temperaturas em K ·
       *   quantidade de matéria em mol · ângulos em rad · trabalho em J.
       *
       * FLUXO DE DADOS
       *   botões de temperatura → Tc/Th → updateChart() → recalculateModel() → séries do Highcharts
       *   e leituras W_ciclo,ideal / W_motor,modelo.
       *   draw() (a cada quadro) → setCycleAngle() → angle_six_engine → marcador do gráfico
       *   (updateCyclePointMarker) e pintura do motor, sempre com a MESMA fase.
       *
       * LAYOUT RESPONSIVO
       *   O posicionamento é feito pelo CSS. O Canvas tem resolução interna fixa (BLOCO 2) e é escalado
       *   por CSS sem distorção; o Highcharts acompanha o seu contêiner por reflow (BLOCO 11).
       *=================================*/

      //=================================
      // BLOCO 1 — INTERFACE INICIAL
      //=================================
      //*********************************
      // Carrega os Tooltipes (Mensagens que Aparecem em Cima do Botão  Retroceder, Play, Avançar e Resetar)
      //*********************************
      const tooltipTriggerList = document.querySelectorAll(
        '[data-bs-toggle="tooltip"]',
      );
      [...tooltipTriggerList].map((el) => new bootstrap.Tooltip(el));

      // Link do item "Vídeo Tutorial do Simulador" do menu Materiais (marcador provisório).
      // >>> PARA TROCAR O ENDEREÇO DO VÍDEO, ALTERE SOMENTE A CONSTANTE ABAIXO. <<<
      const VIDEO_TUTORIAL_URL =
        "https://drive.google.com/drive/folders/1gOEqbCceQGLohwpzx33D1t42AyJPtAXd?usp=sharing";
      document.getElementById("videoTutorialLink").href = VIDEO_TUTORIAL_URL;

      //=================================
      // BLOCO 1B — ESTADO INICIAL (INITIAL_STATE): FONTE ÚNICA DOS VALORES PADRÃO
      //=================================
      // Todo valor que a simulação pode alterar e que precisa voltar ao normal tem aqui o seu valor
      // inicial. A inicialização (declarações de Tc, Th, Dc, Sc, scale, ângulos, posição do motor…) e a
      // função reloadSimulation() leem ESTES valores; nenhum deles é repetido em outro lugar. Para
      // mudar um valor inicial, edite apenas este objeto (o texto "400"/"660" do HTML é só um espaço
      // reservado que o script sobrescreve ao iniciar).
      // Não entram aqui: constantes físicas e geométricas fixas (R, P0, T0, De, Se, Vde, Vdc, dx…),
      // que a simulação nunca altera, e `omega`, derivado de ΔT = Th − Tc por getOmegaForDeltaT().
      const INITIAL_STATE = {
        Tc: 400, // K — temperatura da fonte fria
        Th: 660, // K — temperatura da fonte quente
        Dc: 7, // cm — diâmetro do cilindro de compressão
        Sc: 4, // cm — curso do pistão de potência
        angle: Math.PI, // rad — ângulo mestre; os demais ângulos do mecanismo derivam dele (setCycleAngle)
        isPlaying: false, // a simulação inicia pausada
        scale: 0.75, // escala dos desenhos no Canvas
        hotAmount: 31, // quantidade de linhas da fonte quente
        hotSpacingBase: 20, // espaçamento das linhas da fonte quente (px lógicos, antes de multiplicar por scale)
        xCenter: 241, // px lógicos — posição horizontal do motor no Canvas (centraliza o desenho)
        yCenter: 286, // px lógicos — posição vertical do motor no Canvas
      };

      //=================================
      // BLOCO 2 — CANVAS: CONTEXTO, RESOLUÇÃO INTERNA E POSIÇÃO DO MOTOR
      //=================================
      // O tamanho EXIBIDO do Canvas é definido pelo CSS (cabe no painel mantendo a proporção 560:440,
      // sem distorção). A resolução INTERNA é fixa: o desenho usa coordenadas lógicas de
      // ENGINE_LOGICAL_WIDTH × ENGINE_LOGICAL_HEIGHT px e o bitmap tem ENGINE_RENDER_SCALE vezes esse
      // tamanho (nitidez em telas de alta densidade). Por isso não é necessário tratar resize/orientação:
      // o navegador reescala o bitmap, e o desenho, os controles e a animação continuam iguais.
      // ctx.setTransform aplica o fator de resolução uma única vez; save()/restore() em draw() o preservam.
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const ENGINE_LOGICAL_WIDTH = 560; // px lógicos (igual a --eng-w0 do CSS: proporção 560:440)
      const ENGINE_LOGICAL_HEIGHT = 440; // px lógicos
      const ENGINE_RENDER_SCALE = 2; // bitmap = 2× o tamanho lógico
      canvas.width = ENGINE_LOGICAL_WIDTH * ENGINE_RENDER_SCALE;
      canvas.height = ENGINE_LOGICAL_HEIGHT * ENGINE_RENDER_SCALE;
      ctx.setTransform(ENGINE_RENDER_SCALE, 0, 0, ENGINE_RENDER_SCALE, 0, 0);
      // Junção e ponta de linha: draw() termina com "round" e o contexto mantém esse estado entre os
      // quadros. Definir o mesmo valor aqui faz o PRIMEIRO quadro sair idêntico aos seguintes (e ao
      // quadro desenhado após o reload); sem isso, só o primeiro usava o padrão "miter"/"butt".
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // Posição do motor em coordenadas lógicas (origem do desenho; todas as peças são relativas
      // a xCenter/yCenter e multiplicadas por `scale`). Valores que centralizam o motor no Canvas.
      let xCenter = INITIAL_STATE.xCenter;
      let yCenter = INITIAL_STATE.yCenter;

      //=================================
      // BLOCO 3 — VELOCIDADE DA ANIMAÇÃO (omega) E CONDIÇÕES INICIAIS
      //=================================
      //*********************************
      // Variaveis Inciais e Constantes para o Cálculo e Desenho do Ciclo Stirling
      //*********************************
      // omega = incremento angular POR QUADRO (rad/quadro), não rad/s. É uma regra
      // visual/didática (não uma lei física): quanto maior ΔT = Th - Tc, mais rápida a animação.
      //   ΔT <= 100 K -> OMEGA_SLOW (0.01) | ΔT = 900 K -> OMEGA_NORMAL (0.05) | ΔT >= 1800 K -> OMEGA_FAST (0.09)
      //   Entre as âncoras a velocidade varia continuamente (interpolação linear), então cada
      //   passo de 20 K em Th ou Tc altera a velocidade de forma perceptível.
      const OMEGA_SLOW = 0.01;
      const OMEGA_NORMAL = 0.05;
      const OMEGA_FAST = 0.09;
      const DELTA_T_SLOW = 100; // K
      const DELTA_T_NORMAL = 900; // K (condição inicial de referência)
      const DELTA_T_FAST = 1800; // K
      /**
       * Velocidade angular visual da animação (rad por QUADRO) em função de ΔT = Th − Tc.
       * Interpolação linear por partes entre as âncoras OMEGA_SLOW (ΔT ≤ 100 K), OMEGA_NORMAL (900 K)
       * e OMEGA_FAST (ΔT ≥ 1800 K). Não é grandeza física: apenas regra didática.
       * @param {number} deltaT diferença de temperatura entre as fontes (K)
       * @returns {number} incremento angular por quadro (rad); OMEGA_NORMAL se a entrada for inválida
       */
      function getOmegaForDeltaT(deltaT) {
        if (!Number.isFinite(deltaT)) return OMEGA_NORMAL; // entrada inválida: valor padrão
        if (deltaT <= DELTA_T_SLOW) return OMEGA_SLOW;
        if (deltaT >= DELTA_T_FAST) return OMEGA_FAST;
        if (deltaT <= DELTA_T_NORMAL) {
          const u = (deltaT - DELTA_T_SLOW) / (DELTA_T_NORMAL - DELTA_T_SLOW);
          return OMEGA_SLOW + (OMEGA_NORMAL - OMEGA_SLOW) * u;
        }
        const u = (deltaT - DELTA_T_NORMAL) / (DELTA_T_FAST - DELTA_T_NORMAL);
        return OMEGA_NORMAL + (OMEGA_FAST - OMEGA_NORMAL) * u;
      }
      let omega = OMEGA_NORMAL;

      // Constantes físicas e condição de carga do modelo de referência (Arquivo 1), em unidades SI.
      // Observação: n·R = P0·V0/T0 não depende do valor de R; só o n exibido depende.
      const R = 8.314462; // J/(mol·K)
      const P0 = 101325; // Pa — pressão atmosférica da condição de carga
      const T0 = 298.15; // K — temperatura ambiente da condição de carga
      let n = 0; // mol — calculado por calculateInitialCharge() a partir da condição de carga

      let Tc = INITIAL_STATE.Tc;
      let Th = INITIAL_STATE.Th;

      //=================================
      // BLOCO 4 — MODELO TERMODINÂMICO (ciclo ideal e modelo de Schmidt)
      //=================================
      // Ordem de dependência: geometria → volumes varridos → carga (n) → estados e curvas do ciclo ideal
      // → curva de Schmidt → isotermas de referência → trabalhos. Tudo é refeito por recalculateModel().
      //*********************************
      // MODELO TERMODINÂMICO (incorporado do modelo de referência — Arquivo 1)
      //*********************************
      // Substitui o modelo anterior (geometria lida do desenho do Canvas + calibração didática
      // de 250 L). Unidades: volumes em cm³, pressões calculadas em Pa e plotadas em kPa,
      // temperaturas em K, quantidade de matéria em mol, ângulos em radianos, trabalho em J.
      //
      // Referência angular única: theta = variável `angle` da animação. O mecanismo desenhado
      // concorda com as equações de volume abaixo SEM deslocamento de fase:
      //   deslocador (angle_one_engine = theta + π/2): espaço quente ∝ (1 − cos θ); frio ∝ (1 + cos θ)
      //   potência   (angle_two_engine = theta − π/2): volume ∝ (1 − cos(θ − dx)), com dx = π/2
      //=================================

      // Geometria (mantida conforme os dados originais do modelo de referência)
      const De = 19.8; // cm — diâmetro do espaço de expansão
      const Se = 2; // cm — curso do deslocador
      const Vde = 1.1945; // cm³ — volume morto de expansão
      const Vdc = 0.01789; // cm³ — volume morto de compressão
      const dx = (90 * Math.PI) / 180; // rad — defasagem entre deslocador e pistão de potência
      const x0 = 0; // rad — posição angular da condição de carga e início da curva de Schmidt
      const SCHMIDT_POINTS = 720; // intervalos angulares da curva fechada de Schmidt
      const IDEAL_SAMPLES = 120; // intervalos das isotérmicas do ciclo ideal

      // Parâmetros variáveis (valores iniciais do modelo de referência)
      let Dc = INITIAL_STATE.Dc; // cm — diâmetro do cilindro de compressão
      let Sc = INITIAL_STATE.Sc; // cm — curso do pistão de potência

      let Vse, Vsc, V0; // cm³: volumes varridos (expansão, compressão) e volume na condição de carga
      let V1, V2, V3, V4; // cm³: volumes dos 4 estados do ciclo ideal
      let P1, P2, P3, P4; // Pa: pressões dos 4 estados do ciclo ideal
      let dataPh, dataPc, dataLine14, dataLine23, dataSchmidt; // séries [V (cm³), P (kPa)]
      let dataPh_gray, dataPc_gray; // isotermas de referência (Th e Tc)
      let w12, w34, w; // J: trabalhos do ciclo ideal
      let cycleWorkModel = 0; // J: ∮ P dV da curva de Schmidt (trabalho do MODELO do motor)

      // Margem visual dos eixos (fração de V2 − V1). Não entra em nenhum cálculo: só evita que as
      // isocóricas e o marcador fiquem cortados sobre a borda da área do gráfico.
      const AXIS_MARGIN_FRAC = 0.05;

      /**
       * Volumes varridos pelos dois êmbolos: Vse = π·De²/4·Se (deslocador, expansão) e
       * Vsc = π·Dc²/4·Sc (pistão de potência, compressão). Lê De, Se, Dc, Sc (cm); grava Vse, Vsc (cm³).
       */
      // 3. Geometria e volumes instantâneos
      function calculateSweptVolumes() {
        Vse = ((Math.PI * De ** 2) / 4) * Se;
        Vsc = ((Math.PI * Dc ** 2) / 4) * Sc;
      }

      /**
       * Volumes instantâneos em função do ângulo θ, com defasagem dx entre os êmbolos:
       *   Ve = Vse/2·(1 − cos θ) + Vde                             (expansão, quente)
       *   Vc = Vse/2·(1 + cos θ) + Vsc/2·(1 − cos(θ − dx)) + Vdc   (compressão, fria)
       * @param {number} theta ângulo de fase (rad)
       * @returns {{Ve:number, Vc:number, Vtotal:number}} volumes em cm³
       */
      // Ve: espaço de expansão (quente, a Th). Vc: espaço de compressão (frio, a Tc).
      function calculateVolumes(theta) {
        const Ve = (Vse / 2) * (1 - Math.cos(theta)) + Vde;
        const Vc =
          (Vse / 2) * (1 + Math.cos(theta)) +
          (Vsc / 2) * (1 - Math.cos(theta - dx)) +
          Vdc;

        return { Ve, Vc, Vtotal: Ve + Vc };
      }

      /**
       * Condição de carga: V0 = Vtotal(x0) e n = P0·V0/(R·T0) (V0 convertido para m³).
       * Grava V0 (cm³) e n (mol). Não depende de Th e Tc.
       */
      // 4. Condição inicial e quantidade de gás: n = P0·V0/(R·T0), com V0 em m³
      function calculateInitialCharge() {
        V0 = calculateVolumes(x0).Vtotal; // cm³
        n = (P0 * V0 * 1e-6) / (R * T0);
      }

      /**
       * Gás ideal: P = n·R·T/V.
       * @param {number} temperature temperatura (K)
       * @param {number} volumeCm3 volume (cm³)
       * @returns {number} pressão (Pa)
       */
      // 5. Pressão dos modelos ideal e Schmidt (resultados em Pa)
      function calculatePressureIdeal(temperature, volumeCm3) {
        const volumeM3 = volumeCm3 * 1e-6;
        return (n * R * temperature) / volumeM3;
      }

      /**
       * Modelo isotérmico de Schmidt: P = n·R / (Ve/Th + Vc/Tc), com Ve e Vc em m³.
       * @param {number} theta ângulo de fase (rad)
       * @returns {{pressure:number, volume:number}} pressão (Pa) e volume total (cm³)
       */
      function calculatePressureSchmidt(theta) {
        const volumes = calculateVolumes(theta);
        const VeM3 = volumes.Ve * 1e-6;
        const VcM3 = volumes.Vc * 1e-6;

        const pressure = (n * R) / (VeM3 / Th + VcM3 / Tc);

        return { pressure, volume: volumes.Vtotal };
      }

      /**
       * Amostra uma isoterma P = n·R·T/V entre dois volumes, com `points` intervalos.
       * @returns {Array<[number, number]>} pares [V (cm³), P (kPa)]
       */
      // 6. Estados e curvas do ciclo ideal
      function generateIsothermalCurve(temperature, startVolume, endVolume, points = IDEAL_SAMPLES) {
        const data = [];
        for (let i = 0; i <= points; i++) {
          const volume = startVolume + (endVolume - startVolume) * (i / points);
          const pressure = calculatePressureIdeal(temperature, volume);
          data.push([volume, pressure / 1000]); // cm³, kPa
        }
        return data;
      }

      /**
       * Define os 4 estados do ciclo ideal (V1…V4, P1…P4) e gera as séries do gráfico:
       * dataPh (1→2, isoterma a Th), dataLine23 (2→3, isocórica), dataPc (3→4, isoterma a Tc),
       * dataLine14 (4→1, isocórica). Depende de Th, Tc, n e dos volumes varridos.
       */
      // Numeração dos estados (igual à Figura 4 do TCC, Çengel e Boles): 1 -> 2 expansão isotérmica (Th),
      // 2 -> 3 resfriamento isocórico, 3 -> 4 compressão isotérmica (Tc), 4 -> 1 aquecimento isocórico.
      function generateIdealCycle() {
        V1 = Vse + Vde + Vdc; // volume mínimo
        V2 = V1 + Vsc; // volume máximo
        V3 = V2;
        V4 = V1;

        P1 = calculatePressureIdeal(Th, V1);
        P2 = calculatePressureIdeal(Th, V2);
        P3 = calculatePressureIdeal(Tc, V3);
        P4 = calculatePressureIdeal(Tc, V4);

        dataPh = generateIsothermalCurve(Th, V1, V2);
        dataLine23 = [
          [V2, P2 / 1000],
          [V3, P3 / 1000],
        ];
        dataPc = generateIsothermalCurve(Tc, V3, V4);
        dataLine14 = [
          [V4, P4 / 1000],
          [V1, P1 / 1000],
        ];
      }

      /**
       * Faixa visível do eixo de volume do gráfico: [V1 − m, V2 + m], m = AXIS_MARGIN_FRAC·(V2 − V1).
       * @returns {{min:number, max:number}} limites em cm³ (a margem é apenas visual)
       */
      // Faixa de volume do eixo horizontal (V1 e V2 são também V_min e V_max da curva de Schmidt)
      function getAxisRange() {
        const margin = (V2 - V1) * AXIS_MARGIN_FRAC;
        return { min: V1 - margin, max: V2 + margin };
      }

      /**
       * Gera as isotermas cinza de referência (Th e Tc) sobre a faixa visível: dataPh_gray e dataPc_gray
       * (séries 0 e 1 do gráfico).
       */
      // Isotermas de referência (cinza) de Th e Tc sobre a faixa visível do eixo de volume
      function generateReferenceIsotherms() {
        const range = getAxisRange();
        dataPh_gray = generateIsothermalCurve(Th, range.min, range.max);
        dataPc_gray = generateIsothermalCurve(Tc, range.min, range.max);
      }

      /**
       * Curva fechada de Schmidt: P(θ) e V(θ) para θ de x0 a x0 + 2π em SCHMIDT_POINTS intervalos.
       * @returns {Array<[number, number]>} pares [V (cm³), P (kPa)]; o último ponto repete o primeiro
       */
      // 7. Curva fechada do ciclo de Schmidt (uma volta: theta de x0 a x0 + 2π; o último ponto repete o primeiro)
      function generateSchmidtCurve(points = SCHMIDT_POINTS) {
        const data = [];
        for (let i = 0; i <= points; i++) {
          const theta = x0 + (2 * Math.PI * i) / points;
          const result = calculatePressureSchmidt(theta);
          data.push([result.volume, result.pressure / 1000]); // cm³, kPa
        }
        return data;
      }

      /**
       * Trabalho líquido do ciclo ideal (J): W = W12 + W34 (as isocóricas não realizam trabalho).
       * Grava w12 (expansão a Th) e w34 (compressão a Tc).
       * @returns {number} trabalho por ciclo (J)
       */
      // 8. Trabalhos (J)
      // Ideal: fórmula fechada das duas isotérmicas (as isocóricas não realizam trabalho),
      //   W = n·R·Th·ln(V2/V1) + n·R·Tc·ln(V4/V3).
      // A razão de volumes é adimensional: n [mol]·R [J/(mol·K)]·T [K] já resulta em J.
      function calculateIdealWork() {
        w12 = n * R * Th * Math.log(V2 / V1);
        w34 = n * R * Tc * Math.log(V4 / V3);
        return w12 + w34;
      }

      /**
       * Trabalho do motor no modelo de Schmidt: ∮ P dV pela regra do trapézio sobre a curva fechada.
       * @param {Array<[number, number]>} data pares [V (cm³), P (kPa)]
       * @returns {number} trabalho por ciclo (J); positivo = percurso horário no diagrama P-V
       */
      // Motor (modelo de Schmidt): ∮ P dV pela regra do trapézio sobre a curva fechada.
      // V em cm³ e P em kPa: 1 kPa·cm³ = 10³ Pa · 10⁻⁶ m³ = 10⁻³ J. Positivo = percurso horário no P-V.
      function calculateSchmidtWork(data) {
        let W = 0;
        for (let i = 0; i < data.length - 1; i++) {
          W += ((data[i][1] + data[i + 1][1]) / 2) * (data[i + 1][0] - data[i][0]);
        }
        return W * 1e-3;
      }

      /**
       * Recalcula todo o modelo na ordem de dependência (volumes varridos → carga n → ciclo ideal →
       * curva de Schmidt → isotermas → trabalhos). Chamada na inicialização e a cada mudança de Th/Tc.
       */
      // 9. Recálculo completo (n, ciclo ideal, curva de Schmidt, isotermas e trabalhos).
      // Depende de Th e Tc, por isso é refeito sempre que uma temperatura muda.
      function recalculateModel() {
        calculateSweptVolumes();
        calculateInitialCharge();
        generateIdealCycle();
        dataSchmidt = generateSchmidtCurve();
        generateReferenceIsotherms();
        w = calculateIdealWork();
        cycleWorkModel = calculateSchmidtWork(dataSchmidt);
      }

      /**
       * Estado do gás no ângulo θ pelo modelo de Schmidt, com T efetiva = P·V/(n·R).
       * Disponível para análise; o marcador do gráfico usa calculateIdealCycleState().
       * @returns {{theta:number, V:number, P:number, T:number}} V (cm³), P (kPa), T (K)
       */
      // Estado do gás de trabalho em theta, usado pelo marcador do gráfico e pela coloração térmica.
      // V em cm³, P em kPa (absoluta), T em K (temperatura efetiva T = P·V/(n·R), com Tc <= T <= Th).
      function calculateThermodynamicState(theta) {
        const s = calculatePressureSchmidt(theta);
        return {
          theta,
          V: s.volume,
          P: s.pressure / 1000,
          T: (s.pressure * s.volume * 1e-6) / (n * R),
        };
      }

      /**
       * COMUNICAÇÃO COM A UI: escreve W_ciclo,ideal (#work) e W_motor,modelo (#workModel), em J, com
       * WORK_DECIMALS casas decimais. Chamada após cada recálculo do modelo.
       */
      // Trabalhos exibidos na interface (J). O gás do modelo é pequeno (~10⁻⁴ mol, ~9 cm³),
      // então os trabalhos são da ordem de 10⁻² J; por isso 4 casas decimais.
      const WORK_DECIMALS = 4;
      function updateWorkDisplay() {
        document.getElementById("work").textContent = w.toFixed(WORK_DECIMALS);
        document.getElementById("workModel").textContent =
          cycleWorkModel.toFixed(WORK_DECIMALS);
      }

      /**
       * Escreve no console um resumo agrupado (geometria, volumes, parâmetros, pressões e trabalhos)
       * para conferência e depuração. Apenas lê as variáveis do modelo; não altera estado.
       */
      // Resumo dos cálculos no console do navegador, agrupado por categoria.
      function logModelSummary() {
        const kPa = (Pa) => Number((Pa / 1000).toFixed(3));
        const pSchmidt = dataSchmidt.map((p) => p[1]); // kPa
        console.group("Motor Stirling LTD — resumo do modelo");

        console.group("Parâmetros geométricos");
        console.log("De (diâmetro de expansão):", De, "cm");
        console.log("Se (curso do deslocador):", Se, "cm");
        console.log("Dc (diâmetro de compressão):", Dc, "cm");
        console.log("Sc (curso do pistão de potência):", Sc, "cm");
        console.log("Vde (volume morto de expansão):", Vde, "cm³");
        console.log("Vdc (volume morto de compressão):", Vdc, "cm³");
        console.log("dx (defasagem):", dx, "rad (", (dx * 180) / Math.PI, "°)");
        console.log("x0 (posição angular da carga):", x0, "rad");
        console.groupEnd();

        console.group("Volumes calculados");
        console.log("Vse (volume varrido de expansão):", Vse, "cm³");
        console.log("Vsc (volume varrido de compressão):", Vsc, "cm³");
        console.log("V1 = V4 (volume mínimo):", V1, "cm³");
        console.log("V2 = V3 (volume máximo):", V2, "cm³");
        console.log("ΔV = V2 − V1:", V2 - V1, "cm³");
        console.log("ΔV / Vmin:", ((V2 - V1) / V1) * 100, "%");
        console.log("V0 (volume na posição x0):", V0, "cm³");
        console.groupEnd();

        console.group("Parâmetros termodinâmicos");
        console.log("R:", R, "J/(mol·K)");
        console.log("P0:", P0, "Pa | T0:", T0, "K");
        console.log("Th:", Th, "K | Tc:", Tc, "K");
        console.log("n (quantidade de matéria recalculada):", n, "mol");
        console.groupEnd();

        console.group("Coeficientes do modelo de Schmidt  P = n·R / (Ve/Th + Vc/Tc)");
        console.log("n·R:", n * R, "J/K");
        console.log("1/Th:", 1 / Th, "1/K | 1/Tc:", 1 / Tc, "1/K");
        console.log("Vse/2:", Vse / 2, "cm³ | Vsc/2:", Vsc / 2, "cm³");
        console.groupEnd();

        console.group("Pressões calculadas");
        console.log("P1 (Th, V1):", kPa(P1), "kPa");
        console.log("P2 (Th, V2):", kPa(P2), "kPa");
        console.log("P3 (Tc, V3):", kPa(P3), "kPa");
        console.log("P4 (Tc, V4):", kPa(P4), "kPa");
        console.log("Schmidt, mínima:", Math.min(...pSchmidt), "kPa | máxima:", Math.max(...pSchmidt), "kPa");
        console.groupEnd();

        console.group("Trabalho ideal (por ciclo)");
        console.log("W12 (expansão isotérmica, Th):", w12, "J");
        console.log("W34 (compressão isotérmica, Tc):", w34, "J");
        console.log("W ideal = W12 + W34:", w, "J");
        console.groupEnd();

        console.group("Trabalho real (motor, modelo de Schmidt)");
        console.log("W Schmidt = ∮ P dV:", cycleWorkModel, "J");
        console.log("W Schmidt / W ideal:", (cycleWorkModel / w) * 100, "%");
        console.groupEnd();

        console.groupEnd();
      }

      // INICIALIZAÇÃO DO MODELO: velocidade inicial coerente com ΔT, primeiro cálculo completo,
      // leituras de trabalho na interface e resumo no console. Deve ocorrer antes de criar o gráfico,
      // que usa dataPh_gray, dataPc_gray, dataPh, dataPc, dataLine14, dataLine23 e dataSchmidt.
      omega = getOmegaForDeltaT(Th - Tc); // velocidade inicial coerente com ΔT inicial

      recalculateModel();
      updateWorkDisplay();
      logModelSummary();

      //=================================
      // BLOCO 5 — TEMPERATURAS DAS FONTES (UI)
      //=================================
      //*********************************
      // Variáveis e Funções para Atualizar o Valor da Temperatura
      //*********************************
      let valueTemperatureCold = document.getElementById("coldSource");
      let valueTemperatureHot = document.getElementById("hotSource");
      // Os campos exibem os valores de INITIAL_STATE (o texto do HTML é apenas um espaço reservado)
      valueTemperatureCold.textContent = INITIAL_STATE.Tc;
      valueTemperatureHot.textContent = INITIAL_STATE.Th;

      //*********************************
      // Funções Responsáveis por Atualizar em Tempo Real o valor Fonte Quente e Fonte Fria
      //*********************************
      /**
       * Botões ▲/▼ das fontes, em passos de 20 K. Cada função: (1) toca o efeito sonoro de clique;
       * (2) soma ou subtrai 20 K do valor exibido, respeitando os limites — Tc: 20 a 440 K,
       * Th: 500 a 3000 K; (3) atualiza Tc/Th a partir do texto do elemento (#coldSource / #hotSource);
       * (4) chama updateChart() para recalcular o modelo e atualizar o gráfico.
       * Os botões ficam desabilitados durante a animação (ver playSimulation).
       */
      function coldTemperatureUp() {
        let audioButton = new Audio("./effect/click-369586.mp3");
        audioButton.volume = 0.1;
        audioButton.play();
        if (valueTemperatureCold.textContent == 440) {
          valueTemperatureCold.textContent = 440;
        } else {
          valueTemperatureCold.textContent =
            Number(valueTemperatureCold.textContent) + 20;
        }
        Tc = Number(valueTemperatureCold.textContent);
        updateChart();
      }

      function coldTemperatureDown() {
        let audioButton = new Audio("./effect/click-369586.mp3");
        audioButton.volume = 0.1;
        audioButton.play();
        if (valueTemperatureCold.textContent == 20) {
          valueTemperatureCold.textContent = 20;
        } else {
          valueTemperatureCold.textContent =
            Number(valueTemperatureCold.textContent) - 20;
        }
        Tc = Number(valueTemperatureCold.textContent);
        updateChart();
      }

      function hotTemperatureUp() {
        let audioButton = new Audio("./effect/click-369586.mp3");
        audioButton.volume = 0.1;
        audioButton.play();
        if (valueTemperatureHot.textContent == 3000) {
          valueTemperatureHot.textContent = 3000;
        } else {
          valueTemperatureHot.textContent =
            Number(valueTemperatureHot.textContent) + 20;
        }
        Th = Number(valueTemperatureHot.textContent);
        updateChart();
      }

      function hotTemperatureDown() {
        let audioButton = new Audio("./effect/click-369586.mp3");
        audioButton.volume = 0.1;
        audioButton.play();
        if (valueTemperatureHot.textContent == 500) {
          valueTemperatureHot.textContent = 500;
        } else {
          valueTemperatureHot.textContent =
            Number(valueTemperatureHot.textContent) - 20;
        }
        Th = Number(valueTemperatureHot.textContent);
        updateChart();
      }

      //=================================
      // BLOCO 6 — GRÁFICO P-V (HIGHCHARTS)
      //=================================
      /**
       * Diagrama P-V. Séries, na ordem do array "series":
       *   0 isoterma de referência Th (cinza)   | 1 isoterma de referência Tc (cinza)
       *   2 expansão isotérmica (vermelha)      | 3 compressão isotérmica (azul)
       *   4 aquecimento isocórico (preta)       | 5 resfriamento isocórico (roxa)
       *   6 "Estado Atual" (marcador, scatter)  | 7 curva de Schmidt (verde)
       * Eixos: volume (cm³) em x e pressão (kPa) em y. Zoom/pan por arraste (xy).
       * O tamanho acompanha o contêiner #circleStirling (definido pelo CSS); "responsive.rules" reduz
       * fontes e legenda quando o contêiner é estreito. Fonte única do gráfico: CHART_FONT_FAMILY.
       */
      // Mesma pilha tipográfica do CSS (--font-sans), para o gráfico combinar com o restante da interface.
      const CHART_FONT_FAMILY =
        '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
      //*********************************
      // Gráfico que Mostra o Ciclo Stirling de Forma Simples
      //*********************************
      const chart = Highcharts.chart("circleStirling", {
        chart: {
          zooming: {
            type: "xy",
          },
          panning: {
            enabled: true,

      // ---- Marcador "Estado Atual" e ciclo ideal: índices das séries e funções de interpolação ----
      // SINCRONIZAÇÃO GRÁFICO x MOTOR: o motor e o gráfico compartilham a MESMA fase `angle_six_engine`
      // (ângulo mestre; `angle` e os demais ângulos são derivados dele por setCycleAngle()).
      // Em cada quadro: (1) o ângulo é atualizado em draw(); (2) calculateIdealCycleState(angle_six_engine)
      // obtém (V, P) sobre as curvas do ciclo ideal; (3) o marcador é posto
      // em (V, P) desse estado; (4) o motor é desenhado com o mesmo ângulo. O volume V do eixo
      // horizontal é o volume TOTAL do gás (expansão + compressão, em cm³), e não a posição de um pistão.
      // A linha de Schmidt continua sendo desenhada (generateSchmidtCurve), mas o marcador não a percorre mais.
      // Índices das séries no array "series" do gráfico (ajuste se a posição mudar)
      const CYCLE_POINT_SERIES_INDEX = 6;
      const CYCLE_LOOP_SERIES_INDEX = 7;

      // Posição [V, P] a uma fração f (0 a 1) ao longo de uma polilinha de pontos [V, P]. Usa os próprios
      // pontos plotados (dataPh, dataPc, dataLine23, dataLine14), com interpolação linear entre vizinhos:
      // o resultado fica exatamente sobre o segmento desenhado.
      /**
       * Ponto [V, P] na fração f (0 a 1) de uma polilinha, por interpolação linear entre vizinhos;
       * o resultado cai exatamente sobre o segmento desenhado.
       * @param {Array<[number, number]>} data pontos [V (cm³), P (kPa)]
       * @param {number} f fração do percurso (limitada a [0, 1])
       * @returns {[number, number]} [V, P]
       */
      function pointOnPolyline(data, f) {
        const x = Math.min(1, Math.max(0, f)) * (data.length - 1);
        const i = Math.min(Math.floor(x), data.length - 2);
        const u = x - i;
        return [
          data[i][0] + (data[i + 1][0] - data[i][0]) * u,
          data[i][1] + (data[i + 1][1] - data[i][1]) * u,
        ];
      }

      // Estado [V, P] do ponto atual sobre o CICLO IDEAL, em função de angle_six_engine (θ). Cada quarto
      // de volta percorre uma curva ideal, na ordem e no sentido em que foram geradas (estados 1->2->3->4->1):
      //   π    -> 3π/2: expansão isotérmica (Th), dataPh     (estado 1 -> 2)
      //   3π/2 -> 2π:   resfriamento isocórico,   dataLine23 (estado 2 -> 3)
      //   0    -> π/2:  compressão isotérmica (Tc), dataPc   (estado 3 -> 4)
      //   π/2  -> π:    aquecimento isocórico,    dataLine14 (estado 4 -> 1)
      // A fração f varia linearmente com θ em cada fase; nas junções f = 1 de uma fase e f = 0 da seguinte
      // coincidem no mesmo estado, então não há saltos.
      /**
       * Estado [V, P] do ponto atual sobre o CICLO IDEAL em função de θ: cada quarto de volta percorre
       * uma das quatro curvas (dataPc, dataLine14, dataPh, dataLine23) com fração linear em θ.
       * @param {number} theta ângulo de fase (rad), normalizado internamente para [0, 2π)
       * @returns {{V:number, P:number}} volume (cm³) e pressão (kPa)
       */
      function calculateIdealCycleState(theta) {
        const t = normalizeAngle(theta);
        const quarter = Math.PI / 2;
        let data, f;
        if (t >= Math.PI && t < 1.5 * Math.PI) {
          data = dataPh;
          f = (t - Math.PI) / quarter;
        } else if (t >= 1.5 * Math.PI) {
          data = dataLine23;
          f = (t - 1.5 * Math.PI) / quarter;
        } else if (t < quarter) {
          data = dataPc;
          f = t / quarter;
        } else {
          data = dataLine14;
          f = (t - quarter) / quarter;
        }
        const [V, P] = pointOnPolyline(data, f);
        return { V, P };
      }

      // Atualiza o marcador "Estado Atual" sobre as curvas ideais, a partir de angle_six_engine (mesmo ângulo do desenho).
      /**
       * ATUALIZAÇÃO DO HIGHCHARTS: move o marcador "Estado Atual" (série 6) para o estado ideal
       * correspondente a angle_six_engine (+ MARKER_PHASE_OFFSET). Chamada a cada quadro de draw().
       */
      function updateCyclePointMarker() {
        const state = calculateIdealCycleState(angle_six_engine + MARKER_PHASE_OFFSET);
        chart.series[CYCLE_POINT_SERIES_INDEX].setData([[state.V, state.P]], true, false);
      }

      //=================================
      // COR DA ÁREA INTERNA (ILUSTRATIVA), definida somente por angle_six_engine:
      //   metade de π/2 a 3π/2 tende ao vermelho; a outra metade (por 2π/0), ao azul.
      // A cor clareia até o tom claro em π/2 e 3π/2 e a outra cor se intensifica a partir dele.
      // Acompanha play, step, rewind, reset e velocidade.
      //=================================
      const FLUID_RED = [255, 64, 64];
      const FLUID_BLUE = [64, 64, 255];
      const FLUID_FADE = [200, 200, 200]; // tom claro intermediário do fade
      // Fade contínuo e simétrico em todo o ciclo, sem trecho de cor sólida estendido:
      //   θ = π   -> vermelho sólido  | θ = π/2 e 3π/2 -> tom bem claro (branco)  | θ = 0 -> azul sólido
      //   vermelho -> clareia -> azul  (π -> 3π/2 -> 2π/0)  e  azul -> clareia -> vermelho  (0 -> π/2 -> π)
      // A intensidade da cor segue smoothstep(|−cos θ|): derivada nula nos extremos (cor sólida) e no
      // ponto claro, então não há "quina" nem salto, nos dois sentidos de rotação (play/rewind).
      /**
       * Cor da área interna do motor (ilustrativa), apenas em função de θ: vermelho sólido em π,
       * azul sólido em 0 e tom claro em π/2 e 3π/2 (smoothstep, sem saltos nos dois sentidos).
       * @param {number} theta ângulo mestre (rad)
       * @returns {string} cor CSS "rgb(r, g, b)"
       */
      function getFluidColor(theta) {
        const u = -Math.cos(theta); // +1: vermelho sólido | 0: claro (π/2, 3π/2) | −1: azul sólido
        const k = Math.abs(u); // 0 (claro) ... 1 (cor sólida)
        const e = k * k * (3 - 2 * k); // smoothstep
        const base = u >= 0 ? FLUID_RED : FLUID_BLUE;
        const c = FLUID_FADE.map((f, i) => Math.round(f + (base[i] - f) * e));
        return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
      }

      //=================================
      // BLOCO 7 — ÂNGULO MESTRE E FASES DO CICLO
      //=================================
      //=================================
      // ÂNGULO MESTRE: angle_six_engine determina o ponto do gráfico e todas as peças do motor.
      //   π    -> 3π/2: expansão isotérmica     | 3π/2 -> 2π (0): resfriamento isocórico
      //   0    -> π/2 : compressão isotérmica   | π/2  -> π     : aquecimento isocórico
      // As defasagens das demais peças são as mesmas das condições iniciais originais.
      //=================================
      const TWO_PI = Math.PI * 2;
      /**
       * Reduz um ângulo ao intervalo [0, 2π), inclusive para valores negativos (rewind).
       * @param {number} a ângulo (rad)
       * @returns {number} ângulo normalizado (rad)
       */
      function normalizeAngle(a) {
        return ((a % TWO_PI) + TWO_PI) % TWO_PI; // sempre em [0, 2π), inclusive ao retroceder
      }
      /**
       * Define o ângulo mestre (angle_six_engine) e deriva os demais, com as defasagens do mecanismo:
       * angle (volante) = θ; angle_one_engine e angle_five_engine = θ + π/2 (deslocador e sua manivela);
       * angle_two_engine = θ − π/2 (pistão de potência). Única porta de entrada para mudar a fase.
       * @param {number} theta novo ângulo mestre (rad)
       */
      function setCycleAngle(theta) {
        angle_six_engine = normalizeAngle(theta);
        angle = angle_six_engine;
        angle_one_engine = normalizeAngle(angle_six_engine + Math.PI / 2);
        angle_two_engine = normalizeAngle(angle_six_engine - Math.PI / 2);
        angle_five_engine = normalizeAngle(angle_six_engine + Math.PI / 2);
      }
      /**
       * Nome da fase do ciclo para um ângulo θ. Não é chamada pela interface atual; fica disponível
       * para rótulos ou depuração.
       * @returns {string} "Expansão isotérmica" | "Resfriamento isocórico" | "Compressão isotérmica" | "Aquecimento isocórico"
       */
      function getCyclePhase(theta) {
        const t = normalizeAngle(theta);
        if (t >= Math.PI && t < 1.5 * Math.PI) return "Expansão isotérmica";
        if (t >= 1.5 * Math.PI) return "Resfriamento isocórico";
        if (t < Math.PI / 2) return "Compressão isotérmica";
        return "Aquecimento isocórico";
      }

      //=================================
      // BLOCO 8 — ATUALIZAÇÃO DO MODELO E DO GRÁFICO
      //=================================
      //*********************************
      // Função que Atualiza os Cálculos em Tempo Real a Cada Modificação e Consequentemente o Gráfico
      //*********************************
      /**
       * Remove do gráfico o que o usuário alterou por interação e que updateChart() não desfaz: o
       * botão "Reset zoom" e as séries ocultas pelo clique na legenda. Usada pelo reload.
       */
      function resetChartView() {
        // Remove só o botão "Reset zoom" (chart.zoomOut() é evitado: ele não basta para o passo abaixo).
        if (chart.resetZoomButton) chart.resetZoomButton = chart.resetZoomButton.destroy();
        chart.series.forEach((serie) => {
          if (!serie.visible) serie.setVisible(true, false);
        });
        // Desfaz o zoom/pan e redesenha ANTES de updateChart(): com o zoom ativo o Highcharts recorta os
        // pontos de cada série (série "cropped"), e o setData() de updateChart() então tenta atualizar
        // pontos já descartados (TypeError interno em Point.update). Redesenhado em faixa completa,
        // a série volta a ter todos os pontos e o setData() funciona como na simulação normal.
        chart.xAxis[0].setExtremes(null, null, false);
        chart.yAxis[0].setExtremes(null, null, false);
        // Esvazia todas as séries: updateChart() e updateCyclePointMarker() as preenchem de novo com os
        // dados do estado inicial, sem reaproveitar nenhum ponto da simulação anterior (o setData do
        // Highcharts reaproveita pontos de mesmo x, e com a ordem dos pontos invertida deixaria valores antigos).
        chart.series.forEach((serie) => serie.setData([], false));
        chart.redraw(false);
      }

      /**
       * Devolve os eixos ao ajuste do estado inicial: sem extremos definidos pelo usuário, o eixo x usa
       * a faixa configurada na criação do gráfico (getAxisRange() da condição inicial) e o eixo y volta
       * ao ajuste automático (updateChart() fixa o máximo de y em P1 + 50 kPa). Só deve ser chamada com
       * o modelo no estado inicial, como faz reloadSimulation().
       */
      function resetChartAxes() {
        chart.xAxis[0].setExtremes(null, null, false);
        chart.yAxis[0].setExtremes(null, null, true);
      }

      /**
       * Chamada quando Th ou Tc mudam (botões de temperatura e reload): (1) recalcula o modelo e as
       * leituras de trabalho; (2) atualiza omega pela nova ΔT; (3) ajusta os extremos dos eixos;
       * (4) substitui os dados das séries 0–5 e 7 sem redesenhar e renomeia as isotermas cinza;
       * (5) redesenha uma única vez, reposiciona o marcador e escreve o resumo no console.
       */
      function updateChart() {
        // Th/Tc mudaram: recalcula n, ciclo ideal, curva de Schmidt, isotermas e trabalhos
        recalculateModel();
        updateWorkDisplay();

        omega = getOmegaForDeltaT(Th - Tc);

        const axisRange = getAxisRange();
        chart.xAxis[0].setExtremes(axisRange.min, axisRange.max, false);
        chart.yAxis[0].setExtremes(null, P1 / 1000 + 50, false);

        chart.series[0].setData(dataPh_gray, false);
        chart.series[1].setData(dataPc_gray, false);
        chart.series[2].setData(dataPh, false);
        chart.series[3].setData(dataPc, false);
        chart.series[4].setData(dataLine14, false);
        chart.series[5].setData(dataLine23, false);
        chart.series[CYCLE_LOOP_SERIES_INDEX].setData(dataSchmidt, false);

        chart.series[0].update({ name: `${Th} K` }, false);
        chart.series[1].update({ name: `${Tc} K` }, false);

        chart.redraw();
        updateCyclePointMarker();
        logModelSummary();
      }

      //=================================
      // BLOCO 9 — ANIMAÇÃO DO CANVAS
      //=================================
      // Estado da animação: isPlaying (play/pause), animation (id do requestAnimationFrame), os ângulos
      // do mecanismo (derivados de angle_six_engine por setCycleAngle) e a escala dos desenhos.
      //*********************************
      // Variáveis Inciais Referentes ao Motor Stirling (Omega, Angulos Inciais, Escala e ect)
      //*********************************
      let isPlaying = INITIAL_STATE.isPlaying; // controla play/pause
      let animation; // guarda o requestAnimationFrame atual
      // let omega = 0.05; // Lento --> 0.01 | Normal --> 0.05 | Rápido --> 0.09
      // Fase inicial SOMENTE do marcador "Estado Atual" do gráfico P-V: meio da curva vermelha (π a 3π/2).
      // O motor e os ângulos (angle, angle_one/two/five/six_engine) continuam iniciando em π.
      const MARKER_START_ANGLE = (5 * Math.PI) / 4;
      const MARKER_PHASE_OFFSET = MARKER_START_ANGLE - Math.PI; // π/4, aplicado apenas ao marcador
      // Ângulos do mecanismo: todos derivam do ângulo mestre por setCycleAngle(), a mesma função usada
      // pelo reload (π → deslocador em 3π/2, pistão de potência em π/2).
      let angle, angle_one_engine, angle_two_engine, angle_five_engine, angle_six_engine;
      setCycleAngle(INITIAL_STATE.angle);
      let scale = INITIAL_STATE.scale; // Escala dos Desenhos em Geral
      let hotAmount = INITIAL_STATE.hotAmount; // Quantidade de Linhas da Fonte Quente
      let hotSpacing = INITIAL_STATE.hotSpacingBase * scale; // Espaçamento das Linhas da Fonte Quente

      //*********************************
      // Desenho e Animação do Motor
      //*********************************

      /**
       * Um quadro da animação (executado por requestAnimationFrame enquanto isPlaying é verdadeiro).
       * Sequência: (1) limpa o Canvas; (2) se estiver animando, avança o ângulo mestre em `omega` via
       * setCycleAngle(); (3) sincroniza o marcador do gráfico; (4) pinta o motor de trás para a frente —
       * fontes fria e quente, carcaça, volante, área interna (cor térmica), pistões, virabrequim e
       * manivelas — em coordenadas lógicas (xCenter, yCenter, scale); (5) agenda o próximo quadro.
       * Também é chamada diretamente (sem animar) por step, rewind, reload e pela inicialização.
       * Ângulos → peças: angle (volante) | angle_one_engine (deslocador, usa sen) |
       * angle_two_engine (pistão de potência, usa cos) | angle_five_engine (manivela do deslocador) |
       * angle_six_engine (manivela do pistão de potência e ângulo mestre).
       */
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // só atualiza os ângulos se estiver animando
        if (isPlaying) setCycleAngle(angle_six_engine + omega);

        updateCyclePointMarker(); // <-- nova linha

        //*********************************
        // Fonte Fria
        ctx.beginPath();
        ctx.moveTo(xCenter - 287.5 * scale, yCenter - 30 * scale);
        ctx.lineTo(xCenter - 287.5 * scale, yCenter - 55 * scale);
        ctx.moveTo(xCenter - 300 * scale, yCenter - 42.5 * scale);
        ctx.lineTo(xCenter - 275 * scale, yCenter - 42.5 * scale);
        ctx.moveTo(xCenter - 298 * scale, yCenter - 32 * scale);
        ctx.lineTo(xCenter - 277 * scale, yCenter - 53 * scale);
        ctx.moveTo(xCenter - 277 * scale, yCenter - 32 * scale);
        ctx.lineTo(xCenter - 298 * scale, yCenter - 53 * scale);
        ctx.strokeStyle = "blue";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.closePath();

        //*********************************
        // Fonte Quente
        function desenharFonteQuente(ctx) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(
            13 * scale,
            13 * scale,
            -13 * scale,
            12.5 * scale,
            0 * scale,
            25 * scale,
          );
          ctx.stroke();
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = "red";
        ctx.lineCap = "round";

        ctx.save();
        ctx.translate(xCenter - 300 * scale, yCenter + 165 * scale);

        for (let i = 0; i < hotAmount; i++) {
          ctx.save();
          ctx.translate(i * hotSpacing, 0);
          desenharFonteQuente(ctx);
          ctx.restore();
        }
        ctx.restore();
        ctx.closePath();

        //*********************************
        // Parte Inferior do Compartimento (Quente)
        ctx.beginPath();
        ctx.moveTo(xCenter, yCenter + 150 * scale);
        ctx.lineTo(xCenter - 300 * scale, yCenter + 150 * scale);
        ctx.lineTo(xCenter - 300 * scale, yCenter + 135 * scale);
        ctx.lineTo(xCenter - 300 * scale, yCenter + 135 * scale);
