        audioMachine.currentTime = 0;
        let buttonPlay = document.getElementById("buttonPlay");
        let buttonRewind = document.getElementById("buttonRewind");
        let buttonStep = document.getElementById("buttonStep");
        let buttonReload = document.getElementById("buttonReload");
        setCycleAngle(angle_six_engine - omega);
        draw();
      }

      // Som ambiente da máquina (as chamadas a play()/pause() em playSimulation estão comentadas).
      let audioMachine = new Audio(
        "./effect/spooky-vending-machine-hum-20000.mp3",
      );
      /**
       * Alterna entre reproduzir e pausar.
       * Iniciar: desabilita ▲/▼, rewind e step, troca o ícone play → pause e inicia requestAnimationFrame(draw).
       * Pausar: reabilita os controles, restaura o ícone e cancela o quadro agendado.
       */
      function playSimulation() {
        let audioButton = new Audio("./effect/button-9-88354.mp3");
        audioButton.volume = 0.1;
        audioButton.play();
        let coldTemperatureUpButton = document.getElementById(
          "coldTemperatureUpButton",
        );
        let coldTemperatureDownButton = document.getElementById(
          "coldTemperatureDownButton",
        );
        let hotTemperatureUpButton = document.getElementById(
          "hotTemperatureUpButton",
        );
        let hotTemperatureDownButton = document.getElementById(
          "hotTemperatureDownButton",
        );
        let buttonPlay = document.getElementById("buttonPlay");
        let buttonRewind = document.getElementById("buttonRewind");
        let buttonStep = document.getElementById("buttonStep");
        let buttonReload = document.getElementById("buttonReload");
        buttonRewind.disabled = false;
        buttonRewind.style.boxShadow =
          "inset 2px 2px 5px 2px rgba(226, 222, 218, 0.5), inset -2px -2px 5px 2px rgba(0, 0, 0, 0.5)";
        buttonRewind.style.backgroundColor = "";
        if (!isPlaying) {
          isPlaying = true;
          coldTemperatureUpButton.disabled = true;
          coldTemperatureDownButton.disabled = true;
          hotTemperatureUpButton.disabled = true;
          hotTemperatureDownButton.disabled = true;

          buttonRewind.disabled = true;
          buttonRewind.style.boxShadow =
            "inset 0px 0px 20px 20px rgba(226, 222, 218, 0.4), inset 0px 0px 20px 20px rgba(226, 222, 218, 0.4)";
          buttonRewind.style.backgroundColor = "rgb(69, 68, 67)";
          buttonPlay.querySelector("svg.play").style.display = "none";
          buttonPlay.querySelector("svg.pause").style.display = "block";

          buttonStep.disabled = true;
          buttonStep.style.boxShadow =
            "inset 0px 0px 20px 20px rgba(226, 222, 218, 0.4), inset 0px 0px 20px 20px rgba(226, 222, 218, 0.4)";
          buttonStep.style.backgroundColor = "rgb(69, 68, 67)";
          buttonPlay.querySelector("svg.play").style.display = "none";
          buttonPlay.querySelector("svg.pause").style.display = "block";

          animation = requestAnimationFrame(draw);
        } else {
          isPlaying = false;

          coldTemperatureUpButton.disabled = false;
          coldTemperatureDownButton.disabled = false;
          hotTemperatureUpButton.disabled = false;
          hotTemperatureDownButton.disabled = false;

          buttonStep.disabled = false;
          buttonStep.style.boxShadow =
            "inset 2px 2px 5px 2px rgba(226, 222, 218, 0.5), inset -2px -2px 5px 2px rgba(0, 0, 0, 0.5)";
          buttonStep.style.backgroundColor = "";
          buttonPlay.querySelector("svg.play").style.display = "block";
          buttonPlay.querySelector("svg.pause").style.display = "none";
          cancelAnimationFrame(animation);
        }
      }

      /**
       * Avança um passo (θ + omega) e redesenha. Ignorado durante a animação. Reabilita o rewind.
       */
      function stepSimulation() {
        if (isPlaying) return;
        let audioButton = new Audio("./effect/button-9-88354.mp3");
        audioButton.volume = 0.1;
        audioButton.play();
        let buttonPlay = document.getElementById("buttonPlay");
        let buttonRewind = document.getElementById("buttonRewind");
        let buttonStep = document.getElementById("buttonStep");
        let buttonReload = document.getElementById("buttonReload");
        buttonRewind.disabled = false;
        buttonRewind.style.boxShadow =
          "inset 2px 2px 5px 2px rgba(226, 222, 218, 0.5), inset -2px -2px 5px 2px rgba(0, 0, 0, 0.5)";
        buttonRewind.style.backgroundColor = "";
        setCycleAngle(angle_six_engine + omega);
        draw();
      }

      /**
       * Restaura o simulador ao estado em que estava logo após a inicialização, sem recarregar a página.
       * Referência única dos valores: INITIAL_STATE (BLOCO 1B). Sequência:
       *   1. interrompe a animação (isPlaying = false e cancela o quadro agendado);
       *   2. restaura as variáveis de estado (temperaturas, geometria do compressor, escala, posição do
       *      motor, ângulos) e o texto dos campos de temperatura;
       *   3. reabilita e restaura o aspecto dos controles (▲/▼, rewind, step, ícone de play);
       *   4. limpa o que o usuário alterou no gráfico (zoom/pan, séries ocultas);
       *   5. updateChart(): recalcula o modelo (n, ciclo ideal, Schmidt, isotermas, trabalhos), a
       *      velocidade (omega a partir de ΔT) e substitui os dados de todas as séries;
       *   6. devolve os eixos ao ajuste inicial e redesenha o Canvas (e o marcador do gráfico).
       */
      function reloadSimulation() {
        // 1. Interrompe a animação (cancelAnimationFrame evita um quadro residual após o reset)
        isPlaying = false;
        cancelAnimationFrame(animation);
        let audioButton = new Audio("./effect/ui-button-click-5-327756.mp3");
        audioButton.volume = 0.1;
        audioButton.play();

        // 2. Variáveis de estado (valores de INITIAL_STATE)
        Tc = INITIAL_STATE.Tc;
        Th = INITIAL_STATE.Th;
        Dc = INITIAL_STATE.Dc;
        Sc = INITIAL_STATE.Sc;
        scale = INITIAL_STATE.scale;
        hotAmount = INITIAL_STATE.hotAmount;
        hotSpacing = INITIAL_STATE.hotSpacingBase * scale;
        xCenter = INITIAL_STATE.xCenter;
        yCenter = INITIAL_STATE.yCenter;
        setCycleAngle(INITIAL_STATE.angle);
        valueTemperatureCold.textContent = INITIAL_STATE.Tc;
        valueTemperatureHot.textContent = INITIAL_STATE.Th;

        // 3. Controles
        let coldTemperatureUpButton = document.getElementById(
          "coldTemperatureUpButton",
        );
        let coldTemperatureDownButton = document.getElementById(
          "coldTemperatureDownButton",
        );
        let hotTemperatureUpButton = document.getElementById(
          "hotTemperatureUpButton",
        );
        let hotTemperatureDownButton = document.getElementById(
          "hotTemperatureDownButton",
        );

        let buttonPlay = document.getElementById("buttonPlay");
        let buttonRewind = document.getElementById("buttonRewind");
        let buttonStep = document.getElementById("buttonStep");

        coldTemperatureUpButton.disabled = false;
        coldTemperatureDownButton.disabled = false;
        hotTemperatureUpButton.disabled = false;
        hotTemperatureDownButton.disabled = false;

        buttonRewind.disabled = false;
        buttonRewind.style.boxShadow =
          "inset 2px 2px 5px 2px rgba(226, 222, 218, 0.5), inset -2px -2px 5px 2px rgba(0, 0, 0, 0.5)";
        buttonRewind.style.backgroundColor = "";
        buttonStep.disabled = false;
        buttonStep.style.boxShadow =
          "inset 2px 2px 5px 2px rgba(226, 222, 218, 0.5), inset -2px -2px 5px 2px rgba(0, 0, 0, 0.5)";
        buttonStep.style.backgroundColor = "";
        // Ícone de play visível e de pause oculto, como no HTML inicial (play sem estilo inline)
        buttonPlay.querySelector("svg.play").style.display = "";
        buttonPlay.querySelector("svg.pause").style.display = "none";

        // 4–6. Gráfico: limpa zoom/séries ocultas, recalcula tudo, restaura eixos e redesenha
        resetChartView();
        updateChart();
        resetChartAxes();
        draw();
      }

      //=================================
      // BLOCO 11 — INICIALIZAÇÃO
      //=================================
      // Responsividade do gráfico: o Highcharts já reage ao evento resize da janela; o ResizeObserver
      // cobre também mudanças do contêiner sem resize da janela (troca de retrato/paisagem, barra do
      // navegador móvel, mudança de layout por breakpoint). reflow() só ajusta o tamanho do gráfico:
      // não altera dados nem cálculos. O Canvas não precisa de tratamento (ver BLOCO 2).
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => chart.reflow()).observe(
          document.getElementById("circleStirling"),
        );
      }

      //*********************************
      // Desenha o Motor e os Gráficos de Forma Estática
      //*********************************
      draw();
    </script>
  </body>
</html>
